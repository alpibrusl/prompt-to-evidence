# The concept ledger for "Prompt to Evidence".
#
# This is the book's canon: every piece of jargon it teaches, the ONE definition
# it commits to, and the ONE analogy it uses for that idea throughout. Chapters
# are written against this file; `make check` lints the manuscript against it.
#
# Structurally identical to prompt-to-production's glossary.yaml — same tooling,
# same discipline, different subject.
#
#   term        the canonical name
#   aka         synonyms and near-misses the reader will meet elsewhere
#   definition  the one plain-language definition (used verbatim in the glossary)
#   analogy     the metaphor this book commits to and never contradicts
#   depends_on  terms that must already be defined for this one to make sense
#   defined_in  the chapter that introduces it

kind: technical
title: "Prompt to Evidence"

concepts:

  # ─── Chapter 1 — The Handoff ────────────────────────────────────────────
  - term: "number"
    definition: >-
      A value that came out of a calculation. Not, by itself, a reason to
      believe anything.
    defined_in: 1

  - term: "evidence"
    definition: >-
      A result you could defend to someone who doubts it — someone who asks
      how you know, and expects an answer that survives the question.
    depends_on: ["number"]
    defined_in: 1

  # ─── Chapter 2 — Where Your Data Actually Lives ─────────────────────────
  - term: "noise"
    scan: true
    definition: >-
      Random scatter around the true answer. Averages out as you add more
      data — the reason a bigger sample gives a more precise estimate.
    defined_in: 2

  - term: "bias"
    scan: true
    aka: ["systematic skew"]
    definition: >-
      A systematic distortion that every observation carries in the same
      direction, caused by how the data was collected. More data does not
      fix it — it only gives a more confident estimate of the wrong thing.
    depends_on: ["noise"]
    defined_in: 2

  - term: "representative sample"
    definition: >-
      A smaller slice of a dataset built so it still reflects the same mix
      as the whole — the same proportions of whatever varies in ways that
      matter — rather than just whichever rows happened to load first.
    depends_on: ["bias"]
    defined_in: 2

  # ─── Chapter 3 — The Shape of an Analysis ───────────────────────────────
  - term: "assumption"
    definition: >-
      A condition that has to hold about the data for a method's output to
      mean what it claims to mean. Every method has some, stated or not.
    defined_in: 3

  # ─── Chapter 5 — The Tool, Not the Answer ───────────────────────────────
  - term: "parameter"
    definition: >-
      The part of a computation that changes from one run to the next —
      a month, a segment, a threshold — kept separate from the logic that
      stays fixed regardless of what value is supplied.
    defined_in: 5

  # ─── Chapter 6 — Borrowed, Not Reinvented ───────────────────────────────
  - term: "library"
    definition: >-
      Code someone else already wrote, tested and published, so using it
      does not require reimplementing — or fully understanding — what
      happens inside it.
    defined_in: 6

  # ─── Chapter 7 — Test It Against What You Already Know ──────────────────
  - term: "known-answer test"
    aka: ["sanity check"]
    definition: >-
      Running a method against a case where the correct result is already
      known, to check the method itself before trusting it on a case where
      the answer isn't.
    depends_on: ["parameter"]
    defined_in: 7

  # ─── Chapter 8 — Comparing Two Things Fairly ─────────────────────────────
  - term: "random assignment"
    aka: ["randomization"]
    definition: >-
      Putting each person or unit being compared into one group or another
      by chance, not by anything about who they are. Spreads every other
      difference between the groups evenly, so a remaining gap in outcomes
      is more plausibly caused by the thing being tested.
    depends_on: ["bias"]
    defined_in: 8

  - term: "statistical significance"
    scan: true
    aka: ["significant"]
    definition: >-
      The answer to a precise question — if the two things being compared
      truly made no difference, how surprising would a gap this size be?
      Significant means the honest answer is quite surprising. Not a
      measure of how large or important the effect is, and not the
      probability the effect is real.
    depends_on: ["noise"]
    defined_in: 8

  # ─── Chapter 9 — Measuring What You Did ─────────────────────────────────
  - term: "counterfactual"
    definition: >-
      What would have happened if the thing you did had not happened. Never
      directly observable — only the world that actually occurred is. Every
      method for measuring impact is really a way of building a stand-in
      for the world you didn't get to see.
    defined_in: 9

  - term: "confound"
    scan: true
    definition: >-
      Something that affects both whether — or when — a change was made
      and the outcome being measured, creating the appearance of a
      relationship that isn't really about the change at all.
    depends_on: ["bias", "counterfactual"]
    defined_in: 9

  # ─── Chapter 10 — Confidence, Not Certainty ─────────────────────────────
  - term: "point estimate"
    definition: >-
      The single best-guess number a calculation produces. Real, and always
      a guess — computed from one particular sample that would have come
      out slightly different with another sample drawn the same way.
    defined_in: 10

  - term: "confidence interval"
    definition: >-
      A plausible range around a point estimate, not just the one number —
      narrow when the data pins the answer down precisely, wide when it
      doesn't, regardless of how precise the headline number looks.
    depends_on: ["point estimate", "noise"]
    defined_in: 10

  # ─── Chapter 11 — A Chart Is a Claim ─────────────────────────────────────
  - term: "aggregation"
    definition: >-
      A single summary value standing in for many underlying ones — a
      monthly average standing in for thirty days of real numbers, an
      overall trend line standing in for several groups that may not be
      moving together at all.
    depends_on: ["noise"]
    defined_in: 11
