# The concept ledger for "Prompt to Evidence".
#
# This is the book's canon: every piece of jargon it teaches, the ONE definition
# it commits to, and the ONE analogy it uses for that idea throughout. Chapters
# are written against this file; `make check` lints the manuscript against it.
#
# Structurally identical to prompt-to-production's glossary.yaml — same tooling,
# same discipline, different subject.
#
#   term        the canonical name
#   aka         synonyms and near-misses the reader will meet elsewhere
#   definition  the one plain-language definition (used verbatim in the glossary)
#   analogy     the metaphor this book commits to and never contradicts
#   depends_on  terms that must already be defined for this one to make sense
#   defined_in  the chapter that introduces it

kind: technical
title: "Prompt to Evidence"

# Chapter 14 teaches how to ask rather than a word to ask it with -- what a
# complete request contains, and when the honest answer is to bring in a real expert.
# Chapter 15 is the closing checklist and 16 the afterword: both recap the
# book's vocabulary rather than extend it, so neither introduces a term.
teaches_no_terms: [14, 15, 16]

concepts:

  # ─── Chapter 1 — The Handoff ────────────────────────────────────────────
  - term: "number"
    definition: >-
      A value that came out of a calculation. Not, by itself, a reason to
      believe anything.
    analogy: "A reading on a dial that may or may not be connected to anything."
    defined_in: 1

  - term: "evidence"
    definition: >-
      A result you could defend to someone who doubts it — someone who asks
      how you know, and expects an answer that survives the question.
    analogy: "A receipt rather than a claim: it survives being asked where it came from."
    depends_on: ["number"]
    defined_in: 1

  # ─── Chapter 2 — Where Your Data Actually Lives ─────────────────────────
  - term: "noise"
    scan: true
    definition: >-
      Random scatter around the true answer. Averages out as you add more
      data — the reason a bigger sample gives a more precise estimate.
    analogy: "A shaky hand on a bathroom scale — weigh yourself ten times and average it out."
    defined_in: 2

  - term: "bias"
    scan: true
    aka: ["systematic skew"]
    definition: >-
      A systematic distortion that every observation carries in the same
      direction, caused by how the data was collected. More data does not
      fix it — it only gives a more confident estimate of the wrong thing.
    analogy: >-
      A bathroom scale two kilos light: weigh yourself a thousand times and
      you learn the wrong weight precisely.
    depends_on: ["noise"]
    defined_in: 2

  - term: "representative sample"
    definition: >-
      A smaller slice of a dataset built so it still reflects the same mix
      as the whole — the same proportions of whatever varies in ways that
      matter — rather than just whichever rows happened to load first.
    analogy: "A spoonful from a stirred pot, not the first scoop off the top."
    depends_on: ["bias"]
    defined_in: 2

  # ─── Chapter 3 — The Shape of an Analysis ───────────────────────────────
  - term: "assumption"
    definition: >-
      A condition that has to hold about the data for a method's output to
      mean what it claims to mean. Every method has some, stated or not.
    analogy: "The fine print on a warranty: unread until the thing breaks."
    defined_in: 3
    scan: true

  # ─── Chapter 4 — Make It Compute, Not Guess ─────────────────────────────
  - term: "computation"
    definition: >-
      Arithmetic done by pattern-matching instead of by running actual code.
      The link in the chain where a confidently-delivered number can simply
      be wrong, with nothing in the tone of the answer to say so.
    analogy: >-
      A calculator does not predict what 47 times 83 is; it computes it,
      tracking every digit the same way on the millionth calculation as on
      the first.
    depends_on: ["number"]
    defined_in: 4
    # Not scanned: "computation" is ordinary English, and Chapter 1 uses it
    # while naming the chain. Hunting for it would cry wolf on the book's own
    # roadmap -- the exact false positive that teaches people to ignore a gate.
    scan: false

  # ─── Chapter 5 — The Tool, Not the Answer ───────────────────────────────
  - term: "parameter"
    definition: >-
      The part of a computation that changes from one run to the next —
      a month, a segment, a threshold — kept separate from the logic that
      stays fixed regardless of what value is supplied.
    analogy: "The date you type into the form, not the form."
    defined_in: 5
    scan: true

  # ─── Chapter 6 — Borrowed, Not Reinvented ───────────────────────────────
  - term: "library"
    definition: >-
      Code someone else already wrote, tested and published, so using it
      does not require reimplementing — or fully understanding — what
      happens inside it.
    analogy: "A power tool: you use it without having machined the gears."
    defined_in: 6

  # ─── Chapter 7 — Test It Against What You Already Know ──────────────────
  - term: "known-answer test"
    aka: ["sanity check"]
    # "sanity check" earns its place in the glossary and not in the gate:
    # Chapter 1 uses "sanity-check" as an ordinary English verb, which has
    # nothing to do with this concept. Scanning only the distinctive name
    # keeps the rule that works and drops the one that cries wolf.
    scan: ["known-answer test"]
    definition: >-
      Running a method against a case where the correct result is already
      known, to check the method itself before trusting it on a case where
      the answer isn't.
    analogy: "Weighing a bag of sugar you know is a kilo, to test the scale."
    depends_on: ["parameter"]
    defined_in: 7

  - term: "consistency check"
    definition: >-
      Asking whether a result agrees with something else already known,
      arrived at a different way — a related number, an independent report,
      the surrounding trend. The scalable form of suspicion: run
      continuously on every result, not just the extreme-looking ones,
      without needing to re-derive anything from scratch.
    analogy: "Two witnesses who never met telling the same story."
    depends_on: ["known-answer test"]
    defined_in: 7

  # ─── Chapter 8 — Comparing Two Things Fairly ─────────────────────────────
  - term: "random assignment"
    aka: ["randomization"]
    definition: >-
      Putting each person or unit being compared into one group or another
      by chance, not by anything about who they are. Spreads every other
      difference between the groups evenly, so a remaining gap in outcomes
      is more plausibly caused by the thing being tested.
    analogy: "Dealing the cards, rather than choosing who gets which."
    depends_on: ["bias"]
    defined_in: 8

  - term: "statistical significance"
    scan: true
    aka: ["significant"]
    definition: >-
      The answer to a precise question — if the two things being compared
      truly made no difference, how surprising would a gap this size be?
      Significant means the honest answer is quite surprising. Not a
      measure of how large or important the effect is, and not the
      probability the effect is real.
    analogy: "How surprised you would be by ten heads in a row — not how much you would win."
    depends_on: ["noise"]
    defined_in: 8

  # ─── Chapter 9 — Measuring What You Did ─────────────────────────────────
  - term: "counterfactual"
    definition: >-
      What would have happened if the thing you did had not happened. Never
      directly observable — only the world that actually occurred is. Every
      method for measuring impact is really a way of building a stand-in
      for the world you didn't get to see.
    analogy: "The other road at the fork: describable in detail, never drivable."
    defined_in: 9
    scan: true

  - term: "confound"
    scan: true
    definition: >-
      Something that affects both whether — or when — a change was made
      and the outcome being measured, creating the appearance of a
      relationship that isn't really about the change at all.
    analogy: "Hospitals are full of sick people. The hospital did not make them sick."
    depends_on: ["bias", "counterfactual"]
    defined_in: 9

  # ─── Chapter 10 — Confidence, Not Certainty ─────────────────────────────
  - term: "point estimate"
    definition: >-
      The single best-guess number a calculation produces. Real, and always
      a guess — computed from one particular sample that would have come
      out slightly different with another sample drawn the same way.
    analogy: "One shot at a target, reported as though it were the bullseye."
    defined_in: 10

  - term: "confidence interval"
    definition: >-
      A plausible range around a point estimate, not just the one number —
      narrow when the data pins the answer down precisely, wide when it
      doesn't, regardless of how precise the headline number looks.
    analogy: "How tightly the shots group, not where the last one landed."
    depends_on: ["point estimate", "noise"]
    defined_in: 10

  # ─── Chapter 11 — A Chart Is a Claim ─────────────────────────────────────
  - term: "aggregation"
    definition: >-
      A single summary value standing in for many underlying ones — a
      monthly average standing in for thirty days of real numbers, an
      overall trend line standing in for several groups that may not be
      moving together at all.
    analogy: "One foot in the oven and one in the freezer, reported as a comfortable average."
    depends_on: ["noise"]
    defined_in: 11
    scan: true

  # ─── Chapter 12 — When the Agent Wants to Build a Model ──────────────────
  - term: "machine learning model"
    scan: true
    aka: ["ML model", "predictive model"]
    definition: >-
      A model built from data to predict an output, judged by how well it
      performs on cases it hasn't already seen. Different from a calculation
      built to estimate or explain a relationship — how big an effect is,
      whether a change caused it (Chapters 8-10) — which is judged by a
      confidence interval rather than prediction on unseen data.
    analogy: "A student judged on the exam, not on the homework they revised from."
    defined_in: 12

  - term: "batch model"
    definition: >-
      A machine learning model that runs once, or on a schedule you
      control, in an environment you control, producing a set of outputs
      and then stopping until next time — a churn list generated monthly,
      not a live decision made continuously.
    analogy: "A monthly report, printed and left on a desk."
    depends_on: ["machine learning model"]
    defined_in: 12

  - term: "online model"
    definition: >-
      A machine learning model embedded inside a running system, making
      predictions continuously and automatically as part of something
      being actively used, with no human reviewing each individual output
      before it takes effect.
    analogy: "A thermostat: deciding all day, with nobody reading the output."
    depends_on: ["batch model"]
    defined_in: 12

  - term: "overfitting"
    scan: true
    definition: >-
      Scoring brilliantly on the exact data a model was built from and
      considerably worse on anything new — memorising the specific data
      rather than learning the pattern underneath it.
    analogy: "A student who memorised last year's exam paper."
    defined_in: 12

  - term: "held-out data"
    aka: ["test set"]
    definition: >-
      A portion of the data set aside and never shown to a model while it
      is being built, used only afterward to check how it performs on
      cases it genuinely hasn't seen.
    analogy: "The questions the student never saw while revising."
    depends_on: ["known-answer test", "overfitting"]
    defined_in: 12

  - term: "experiment tracking"
    definition: >-
      Keeping a record of every attempt at a model — what changed, what it
      scored, on which held-out data — not just the one that shipped. What
      tells you whether a winning attempt beat the field by a real margin
      or just got lucky on this particular split among many tries.
    analogy: "The whole lab notebook, not just the page the result is on."
    depends_on: ["held-out data"]
    defined_in: 12

  # ─── Chapter 13 — Data You Can Trust ─────────────────────────────────────
  - term: "data profiling"
    definition: >-
      Checking the basic shape of a dataset before analysing it — how much
      is missing per column, what the actual unique values in a category
      field are, the min and max of a numeric one — to catch a corrupted
      or inconsistent dataset before it quietly shapes every result built
      on top of it.
    analogy: "Reading the labels before you unpack the shipment."
    defined_in: 13
